[theme]
base = "dark"
primaryColor = "#7c5cff"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1d29"

[browser]
gatherUsageStats = false   # privacy-first: no Streamlit telemetry

[server]
headless = true
address = "localhost"   # privacy-first: not reachable from the network
maxUploadSize = 50
